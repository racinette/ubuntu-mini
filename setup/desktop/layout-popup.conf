# Centered, transient keyboard-layout confirmation.
[app-name=minion-layout]
anchor=center
layer=overlay
font=DejaVu Sans 20
width=220
height=120
padding=18
border-size=2
border-radius=14
background-color=#151820ee
text-color=#c0caf5
border-color=#7aa2f7
text-alignment=center
format=<b>%s</b>\n<span size="small">%b</span>
icons=0
default-timeout=1000
ignore-timeout=1
