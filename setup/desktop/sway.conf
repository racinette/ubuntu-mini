set $mod Mod4
set $term minion-terminal
set $menu fuzzel
font pango:DejaVu Sans Mono 10
floating_modifier $mod normal
# Align wheel scrolling with window selection without recentering while scrolling.
mouse_warping container
# Keep desktop shortcuts on the same physical keys in every typing layout.
bindsym --to-code $mod+Return exec $term
bindsym --to-code $mod+d exec $menu
bindsym --to-code $mod+Shift+q kill
bindsym --to-code $mod+Shift+c reload
bindsym --to-code $mod+Shift+e exec swaynag -t warning -m 'End this session?' -B 'Log out' 'swaymsg exit'
bindsym --to-code $mod+l exec minion-lock
bindsym --to-code $mod+Ctrl+g exec minion-gamepad --toggle
bindsym --to-code $mod+e exec thunar
bindsym --to-code $mod+b exec firefox
# Toggle local dictation; discard a recording/transcription with Shift+Super+V.
bindsym --to-code --no-repeat $mod+v exec minion-voice toggle
bindsym --to-code --no-repeat $mod+Shift+v exec minion-voice cancel
bindsym --to-code $mod+h focus left
bindsym --to-code $mod+j focus down
bindsym --to-code $mod+k focus up
bindsym --to-code $mod+semicolon focus right
bindsym --to-code $mod+Shift+h move left
bindsym --to-code $mod+Shift+j move down
bindsym --to-code $mod+Shift+k move up
bindsym --to-code $mod+Shift+semicolon move right
bindsym --to-code $mod+f fullscreen
bindsym --to-code $mod+space focus mode_toggle
bindsym --to-code $mod+Shift+space floating toggle
bindsym --to-code $mod+s layout stacking
bindsym --to-code $mod+w layout tabbed
bindsym --to-code $mod+1 workspace number 1
bindsym --to-code $mod+2 workspace number 2
bindsym --to-code $mod+3 workspace number 3
bindsym --to-code $mod+4 workspace number 4
bindsym --to-code $mod+Shift+1 move container to workspace number 1
bindsym --to-code $mod+Shift+2 move container to workspace number 2
bindsym --to-code $mod+Shift+3 move container to workspace number 3
# Firmware translates Fn combinations into these standard multimedia keys.
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked --no-repeat XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked --no-repeat XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindsym --locked XF86MonBrightnessUp exec brightnessctl -c backlight set +5%
bindsym --locked XF86MonBrightnessDown exec brightnessctl -c backlight set 5%-
bindsym --no-repeat XF86AudioStop exec playerctl stop
bindsym --no-repeat XF86AudioPrev exec playerctl previous
bindsym --no-repeat XF86AudioPlay exec playerctl play-pause
bindsym --no-repeat XF86AudioPause exec playerctl play-pause
bindsym --no-repeat XF86AudioNext exec playerctl next
# Reuse the built-in keyboard's Fn+F3/F4/F5 for display/awake/refresh controls.
# Snapshot display state on press, then act after release so input wake cannot
# immediately undo display-off. Fn+F6 remains unassigned.
bindsym --input-device=1:1:AT_Translated_Set_2_keyboard --locked --no-repeat XF86AudioStop exec minion-idle-controls display-press
bindsym --input-device=1:1:AT_Translated_Set_2_keyboard --locked --no-repeat --release XF86AudioStop exec minion-idle-controls display-release
bindsym --input-device=1:1:AT_Translated_Set_2_keyboard --no-repeat XF86AudioPrev exec minion-idle-controls toggle-awake
bindsym --input-device=1:1:AT_Translated_Set_2_keyboard --no-repeat XF86AudioPlay exec minion-idle-controls toggle-refresh
bindsym --input-device=1:1:AT_Translated_Set_2_keyboard --no-repeat XF86AudioPause exec minion-idle-controls toggle-refresh
bindsym --input-device=1:1:AT_Translated_Set_2_keyboard --no-repeat XF86AudioNext nop
bindsym --no-repeat Print exec minion-screenshot
# WIN Mini 2023 rear buttons emit Print/Pause on this separate keyboard.
# Consume both edges; the reader handles R4 tap/hold and leaves L4 unassigned.
# The physical keyboard's Print Screen shortcut remains available.
bindsym --input-device=12068:309:Mouse_for_Windows --locked --no-repeat Print nop
bindsym --input-device=12068:309:Mouse_for_Windows --locked --no-repeat --release Print nop
bindsym --input-device=12068:309:Mouse_for_Windows --locked --no-repeat Pause nop
bindsym --input-device=12068:309:Mouse_for_Windows --locked --no-repeat --release Pause nop
# Use one keymap so controller Shift/Ctrl combine with physical typing.
input type:keyboard {
    xkb_layout us,ru
}
# Switch typing layout once, including at the lock screen.
bindsym --to-code --locked --no-repeat Ctrl+space input "1:1:AT_Translated_Set_2_keyboard" xkb_switch_layout next
input type:touchpad {
    tap enabled
    natural_scroll enabled
}
# Associate the WIN Mini touchscreen with its rotated built-in panel.
# Without this, touches can land outside the intended application.
input "8746:65521:ILTP7807:00_222A:FFF1" map_to_output eDP-1
# The WIN Mini's 7-inch 1080p panel needs larger controls as well as text.
# Personal output settings in minion.conf below can override this default.
output * scale 2
output * bg #151820 solid_color
default_border pixel 2
bar {
    position bottom
    status_command minion-status
}
exec minion-session-ready
# Optional personal/device settings: layouts, scale, outputs, application rules.
include ~/.config/sway/minion-refresh.conf
include ~/.config/sway/minion.conf
