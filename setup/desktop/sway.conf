set $mod Mod4
set $term foot
set $menu fuzzel
font pango:DejaVu Sans Mono 10
floating_modifier $mod normal
bindsym $mod+Return exec $term
bindsym $mod+d exec $menu
bindsym $mod+Shift+q kill
bindsym $mod+Shift+c reload
bindsym $mod+Shift+e exec swaynag -t warning -m 'End this session?' -B 'Log out' 'swaymsg exit'
bindsym $mod+l exec minion-lock
bindsym $mod+Ctrl+g exec minion-gamepad --toggle
bindsym $mod+e exec thunar
bindsym $mod+b exec firefox
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+semicolon focus right
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+semicolon move right
bindsym $mod+f fullscreen
bindsym $mod+space focus mode_toggle
bindsym $mod+Shift+space floating toggle
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
# Firmware translates Fn combinations into these standard multimedia keys.
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked --no-repeat XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked --no-repeat XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindsym --locked XF86MonBrightnessUp exec brightnessctl -c backlight set +5%
bindsym --locked XF86MonBrightnessDown exec brightnessctl -c backlight set 5%-
bindsym --no-repeat XF86AudioStop exec playerctl stop
bindsym --no-repeat XF86AudioPrev exec playerctl previous
bindsym --no-repeat XF86AudioPlay exec playerctl play-pause
bindsym --no-repeat XF86AudioPause exec playerctl play-pause
bindsym --no-repeat XF86AudioNext exec playerctl next
bindsym --no-repeat Print exec grim - | wl-copy --type image/png
# WIN Mini 2023 rear buttons emit Print/Pause on this separate keyboard.
# Consume both edges; the rear-button reader debounces firmware macro repeats.
# The physical keyboard's Print Screen shortcut remains available.
bindsym --input-device=12068:309:Mouse_for_Windows --locked --no-repeat Print nop
bindsym --input-device=12068:309:Mouse_for_Windows --locked --no-repeat --release Print nop
bindsym --input-device=12068:309:Mouse_for_Windows --locked --no-repeat Pause nop
bindsym --input-device=12068:309:Mouse_for_Windows --locked --no-repeat --release Pause nop
input type:touchpad {
    tap enabled
    natural_scroll enabled
}
# Associate the WIN Mini touchscreen with its rotated built-in panel.
# Without this, touches can land outside the intended application.
input "8746:65521:ILTP7807:00_222A:FFF1" map_to_output eDP-1
# The WIN Mini's 7-inch 1080p panel needs larger controls as well as text.
# Personal output settings in minion.conf below can override this default.
output * scale 2
output * bg #151820 solid_color
default_border pixel 2
bar {
    position bottom
    status_command minion-status
}
exec minion-session-ready
# Optional personal/device settings: layouts, scale, outputs, application rules.
include ~/.config/sway/minion.conf
