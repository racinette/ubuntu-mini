# Local English/Russian dictation. Super+V or the Mic bar button starts/stops.
engine = "whisper"
state_file = "auto"

[hotkey]
# Sway handles the shortcut; no access to physical keyboard devices is needed.
enabled = false

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 120

[whisper]
mode = "local"
model = "/usr/local/share/minion/voice/ggml-small-q5_1.bin"
# The session activation helper selects en/ru from Sway for each recording.
language = "en"
translate = false
threads = 4
# Release model memory between uses on this battery-powered device.
on_demand_loading = true

[output]
mode = "type"
driver_order = ["wtype", "clipboard"]
fallback_to_clipboard = true
auto_submit = false
type_delay_ms = 0
pre_type_delay_ms = 150

[output.notification]
on_recording_start = true
on_recording_stop = true
on_transcription = false
